daemon:
  name: "lris2csu"  # Name under which it subscribes and publishes
  zmq:
    command_address: "tcp://127.0.0.1:5555"  # Address/socket daemon subscribes to commands
    publish_address: "tcp://127.0.0.1:5556"  # Address/socket daemon publishes updates to

hardware: !CSUHardwareConfig
  ethercat_device: "eno1"  # Device for connecting to the EtherCAT bus
  left_brake: 'lris2.csu_break.left'
  right_brake: 'lris2.csu_break.right'
  bar_pairs:
    - !BarPairConfig
      id: 11
      left: !BarConfig
        bus_id: 23
        torque_limit: 2.0
        speed: 6000
        mm_per_count: 1
        reversed: False
      right: !BarConfig
        bus_id: 11
        torque_limit: 2.0
        speed: 6000
        mm_per_count: 1
        reversed: True
